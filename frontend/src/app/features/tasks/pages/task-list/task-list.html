<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="h4 mb-0">Listado de Tareas</h2>
    <div>

      <button class="btn btn-primary me-2" routerLink="/tasks/new">
        + Nueva Tarea
      </button>

      <button class="btn btn-primary" routerLink="/user/new">
        + Crear Usuario
      </button>
    </div>
  </div>

  <!-- Sección de Filtros -->
  <div class="row g-3 mb-4 bg-light p-3 rounded border">
    <div class="col-md-5">
      <label for="filterUser" class="form-label fw-bold">Filtrar por Usuario</label>
      <select 
        id="filterUser" 
        class="form-select" 
        [ngModel]="selectedUserId()" 
        (ngModelChange)="selectedUserId.set($event)">
        <option value="">Todos los usuarios</option>
        @for (user of userList(); track user.id) {
          <option [value]="user.id">{{ user.name }}</option>
        }
      </select>
    </div>

    <div class="col-md-5">
      <!-- <label for="filterStatus" class="form-label fw-bold">Filtrar por Estado</label>
      <select 
        id="filterStatus" 
        class="form-select" 
        [ngModel]="selectedStatus()" 
        (ngModelChange)="selectedStatus.set($event)">
        <option value="">Todos los estados</option>
        @for (status of statusOptions; track status) {
          <option [value]="status">{{ status }}</option>
        }
      </select> -->

      <label for="filterStatus" class="form-label fw-bold">Filtrar por Estado</label>
      <select
        id="filterStatus" 
        class="form-select" 
        [ngModel]="selectedStatus()" 
        (ngModelChange)="selectedStatus.set($event)">
        <option value="Pending">Pendiente</option>
        <option value="InProgress">En Progreso</option>
        <option value="Done">Realizada</option>
      </select>
    </div>

    <div class="col-md-2 d-flex align-items-end">
      <button class="btn btn-outline-secondary w-100" (click)="clearFilters()">
        Limpiar
      </button>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th scope="col">#</th>
          <th scope="col">Título</th>
          <th scope="col">Descripción</th>
          <th scope="col">Usuario asignado</th>
          <th scope="col">Prioridad</th>
          <th scope="col" class="text-end">Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (task of filteredTasks(); track task.createdAt; let i = $index) {
          <tr>
            <td>{{ i + 1 }}</td>
            <td>{{ task.title }}</td>
            <td>{{ task.description }}</td>
            <td>{{ task.userName }}</td>
            <td>{{ task.status }}</td>
            <td class="text-end">
              <button 
                class="btn btn-sm btn-outline-warning me-2"
                [disabled]="task.status === 'Done'" 
                (click)="onChangeStatus(task)"
              >
                Cambiar Estado
              </button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="6" class="text-center py-4 text-muted">
              No hay tareas disponibles.
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
