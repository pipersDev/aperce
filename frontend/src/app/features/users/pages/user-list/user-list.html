<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="h4 mb-0">Listado de Usuarios</h2>
    <button class="btn btn-primary" routerLink="/tasks">
      Lista de tareas
    </button>

    <button class="btn btn-primary" routerLink="/user/new">
      + Crear Usuario
    </button>
  </div>

  <div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th scope="col">#</th>
          <th scope="col">Nombre Usuario</th>
          <th scope="col">Correco Electronico</th>
        </tr>
      </thead>
      <tbody>
        @for (user of userList(); track user.id; let i = $index) {
          <tr>
            <td>{{ i + 1 }}</td>
            <td>{{ user.name }}</td>
            <td>{{ user.email }}</td>
          </tr>
        } @empty {
          <tr>
            <td colspan="5" class="text-center py-4 text-muted">
              No hay usuarios disponibles.
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
